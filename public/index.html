<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareBridge</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b6b5c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--fg:#15202b;--card:#fff;--mut:#5b6773;--line:#dfe3e8;--pri:#0b6b5c;--red:#c62828;--amb:#b26a00;--grn:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#0f1418;--fg:#e8edf1;--card:#182026;--mut:#9aa7b2;--line:#2a343c;--pri:#3fb8a2;--red:#ff6b6b;--amb:#f0b34a;--grn:#6fcf7a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 80px}
.card,.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.grow{flex:1;display:flex;flex-direction:column}small,.mute{color:var(--mut)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin:4px 0 10px}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.full{width:100%}.btn.sm{padding:6px 10px;font-size:.9rem}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--grn)}.dot.red{background:var(--red)}.dot.amber{background:var(--amb)}.dot.none{background:var(--line)}
.pill{font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.red{color:var(--red)}.pill.amber{color:var(--amb)}.pill.green{color:var(--grn)}.pill.none{color:var(--mut)}
.banner{background:var(--card);border-left:4px solid var(--amb);padding:10px;border-radius:8px;margin:10px 0}
.msg{padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin:6px 0}.msg.me{background:var(--line)}
.q{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style></head><body><div id="app"><p style="padding:20px;font-family:system-ui,sans-serif">Loading CareBridge…</p></div>
<script>
function cbShow(m){var a=document.getElementById("app");a.innerHTML='<div style="max-width:560px;margin:30px auto;padding:16px;font-family:system-ui,sans-serif"><h2>CareBridge hit a problem</h2><p>Please send a screenshot of this to your developer:</p><pre style="white-space:pre-wrap;background:#eee;color:#000;padding:10px;border-radius:8px">'+String(m).replace(/[<&>]/g,"")+"</pre></div>"}
window.addEventListener("error",function(e){
  if(e.target&&e.target.tagName==="SCRIPT"){return cbShow("Could not load file: "+e.target.src)}
  if(/^(Uncaught )?(Error: )?CareBridge:/.test(e.message||""))return;
  cbShow((e.message||"error")+" ("+String(e.filename||"").split("/").pop()+":"+(e.lineno||"")+")")},true);
window.addEventListener("unhandledrejection",function(e){cbShow("Promise error: "+((e.reason&&e.reason.message)||e.reason))});
</script>
<script src="supabase.js"></script>
<script>
/* ====== EDIT THESE THREE VALUES (the URL and public key are safe to put here; NEVER the service-role/secret key) ====== */
var CFG={url:"https://nbymzlxeussxgwofsaal.supabase.co",key:"sb_publishable_HHRd5XowldZVJkKZ9Ct9cg_t8tS3WFn",domain:"patients.example.org"};

if(typeof supabase==="undefined"){document.getElementById("app").innerHTML='<div style="max-width:560px;margin:40px auto;padding:16px"><h2>CareBridge could not load</h2><p>A required file (supabase.js) is missing or was blocked. Check that it is inside the public folder, then refresh.</p></div>';throw new Error("supabase.js not loaded")}
if(/PASTE_/.test(CFG.url)||/PASTE_/.test(CFG.key)){document.getElementById("app").innerHTML='<div style="max-width:560px;margin:40px auto;padding:16px"><h2>CareBridge is not connected yet</h2><p>Open <code>public/index.html</code>, replace the two PASTE_ values in <code>var CFG</code> with your Supabase Project URL and public key, and save.</p></div>';throw new Error("CareBridge: config not set")}
var sb=supabase.createClient(CFG.url,CFG.key),A=document.getElementById("app"),qs=new URLSearchParams(location.search);
var DEPTS=["Cardiology","Diabetes and endocrine","Respiratory","Renal","Maternity","General medical","Surgical","Paediatrics","Other"];
var LB={green:"On track",amber:"Needs a call",red:"Urgent",none:"No check-in"};
var QS=[["meds","Did you take your medicines today?"],["sw","Is your swelling worse than usual?"],["br","Is it harder to breathe than usual?"],["fv","Do you have a fever or feel very hot?"]];
var S={stage:"login",mode:"staff",flt:"monitoring",dept:"",q:"",tab:"patients",pts:[],ci:{},ms:{},sel:null,flash:"",reg:null,org:qs.get("org")||"",form:null,urgent:false,redo:false,note:""};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(i){return document.getElementById(i)}
function v(i){var e=$(i);return e?e.value.trim():""}
function fl(){return S.flash?'<div class="banner">'+esc(S.flash)+"</div>":""}
function when(t){return new Date(t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})}
function isToday(t){return new Date(t).toDateString()===new Date().toDateString()}
function last(id){var l=S.ci[id]||[];return l[l.length-1]}
function lv(id){var c=last(id);return c?c.risk:"none"}
function run(fn){return Promise.resolve().then(function(){S.flash="";return fn()}).catch(function(e){S.flash=(e&&e.message)||String(e)}).then(draw)}
function fn(body){return sb.functions.invoke("patients",{body:body}).then(function(r){
  if(r.error){return (r.error.context&&r.error.context.json?r.error.context.json():Promise.resolve({})).catch(function(){return{}}).then(function(j){throw new Error(j.error||"Request failed.")})}
  if(r.data&&r.data.error)throw new Error(r.data.error);return r.data})}
function qget(){try{return JSON.parse(localStorage.getItem("cb_q")||"[]")}catch(e){return[]}}
function qset(q){try{localStorage.setItem("cb_q",JSON.stringify(q))}catch(e){}}
function flushQ(){if(S.role!=="patient"||!S.me||!navigator.onLine)return;
  var q=qget().filter(function(x){return x.pid===S.me.id});if(!q.length)return;
  sb.from("checkins").insert(q[0].row).then(function(r){if(r.error)return;
    qset(qget().filter(function(x){return x.t!==q[0].t}));S.queued=qget().some(function(x){return x.pid===S.me.id});
    return loadPatient().then(function(){draw();flushQ()})}).catch(function(){})}
window.addEventListener("online",flushQ);
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
async function loadOrgs(){var r=await sb.from("organization_members").select("organization_id,role,organizations(name)").eq("user_id",S.uid).eq("active",true);
  if(r.error)throw r.error;S.orgs=r.data.map(function(x){return{id:x.organization_id,role:x.role,name:(x.organizations&&x.organizations.name)||""}})}
function addOrg(){run(async function(){var n=v("on_n");if(!n)throw new Error("Enter a name for the organization.");S.newOrg=await fn({action:"create_org",org_id:S.org,name:n});await loadOrgs()})}
function switchOrg(id){run(async function(){var o=S.orgs.find(function(x){return x.id===id});if(!o)return;S.org=id;S.orgRole=o.role;try{localStorage.setItem("cb_org",id)}catch(e){}S.team=null;S.sel=null;S.newOrg=null;S.tab="patients";await loadStaff()})}
function openAccount(){S.tab="account";S.sel=null;S.reg=null;S.flash="";S.newStaff=null;S.newOrg=null;draw();
  run(async function(){await loadOrgs();if(S.orgRole==="owner")S.team=(await fn({action:"list_staff",org_id:S.org})).staff})}
function teamReload(){return fn({action:"list_staff",org_id:S.org}).then(function(d){S.team=d.staff})}
function addStaff(){run(async function(){var b={action:"add_staff",org_id:S.org,name:v("st_n"),email:v("st_e"),role:v("st_r")};
  if(!b.name||!b.email)throw new Error("Enter a name and an email.");S.newStaff=await fn(b);await teamReload()})}
function setActive(uid,active){run(async function(){await fn({action:"set_staff_active",org_id:S.org,user_id:uid,active:active});await teamReload()})}
function changePw(){var a=v("pw1"),b=v("pw2");run(async function(){if(a.length<10)throw new Error("Use at least 10 characters.");
  if(a!==b)throw new Error("The two passwords do not match.");var r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;S.flash="Password changed."})}
function out(){sb.auth.signOut().then(function(){location.reload()})}

/* ---------- sign-in ---------- */
function boot(){sb.auth.getSession().then(function(r){if(r.data&&r.data.session)run(enter);else draw()}).catch(function(e){cbShow("Start-up error: "+((e&&e.message)||e))})}
function login(){run(async function(){
  var r;
  if(S.mode==="patient"){r=await sb.auth.signInWithPassword({email:v("lc").toLowerCase()+"@"+CFG.domain,password:v("lp")});if(r.error)throw new Error(/invalid login credentials/i.test(r.error.message)?"Wrong code or PIN.":"Sign-in problem: "+r.error.message)}
  else{S.org=v("lo");r=await sb.auth.signInWithPassword({email:v("le"),password:v("lp")});if(r.error)throw new Error(/invalid login credentials/i.test(r.error.message)?"Wrong email or password.":"Sign-in problem: "+r.error.message)}
  await enter()})}
async function deny(msg){await sb.auth.signOut();S.stage="login";S.flash=msg}
async function enter(){
  var u=(await sb.auth.getUser()).data.user;if(!u){S.stage="login";return}
  var p=(await sb.from("profiles").select("role,name").eq("id",u.id).maybeSingle()).data;
  if(!p)return deny("No CareBridge profile for this account.");
  S.name=p.name;
  if(p.role==="patient"){S.role="patient";await loadPatient();S.queued=qget().some(function(x){return x.pid===S.me.id});S.stage="app";setTimeout(flushQ,500);return}
  S.role="staff";
  var org=S.org||localStorage.getItem("cb_org")||"";
  var m=org?(await sb.from("organization_members").select("role").eq("organization_id",org).eq("user_id",u.id).eq("active",true).maybeSingle()).data:null;
  if(!m)return deny("Access denied: you are not an active member of that organization.");
  S.uid=u.id;S.org=org;S.orgRole=m.role;try{localStorage.setItem("cb_org",org)}catch(e){}
  var aal=(await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data;
  if(aal&&aal.currentLevel==="aal2"){await loadStaff();S.stage="app";return}
  var f=(await sb.auth.mfa.listFactors()).data||{};
  var ok=(f.totp||[]).find(function(x){return x.status==="verified"});
  if(ok){S.factor=ok.id;S.stage="challenge";return}
  var stale=(f.all||[]).filter(function(x){return x.status==="unverified"});
  for(var i=0;i<stale.length;i++)await sb.auth.mfa.unenroll({factorId:stale[i].id});
  var en=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"CareBridge"});
  if(en.error)throw en.error;
  S.factor=en.data.id;S.qr=en.data.totp.qr_code;S.secret=en.data.totp.secret;S.stage="enrol"}
function verifyMfa(){run(async function(){
  var r=await sb.auth.mfa.challengeAndVerify({factorId:S.factor,code:v("mc")});
  if(r.error)throw new Error("That code is not valid. Use the newest code from your authenticator app.");
  await loadStaff();S.stage="app"})}

/* ---------- data ---------- */
async function loadRest(ids){
  S.ci={};S.ms={};if(!ids.length)return;
  var c=await sb.from("checkins").select("*").in("patient_id",ids).order("created_at");
  var m=await sb.from("messages").select("*").in("patient_id",ids).order("created_at");
  if(c.error)throw c.error;if(m.error)throw m.error;
  c.data.forEach(function(x){(S.ci[x.patient_id]=S.ci[x.patient_id]||[]).push(x)});
  m.data.forEach(function(x){(S.ms[x.patient_id]=S.ms[x.patient_id]||[]).push(x)})}
async function loadStaff(){
  var r=await sb.from("patients").select("*,patient_organizations!inner(organization_id)").eq("patient_organizations.organization_id",S.org).order("created_at",{ascending:false});
  if(r.error)throw r.error;S.pts=r.data;await loadRest(S.pts.map(function(p){return p.id}))}
async function loadPatient(){
  var r=await sb.from("patients").select("*").limit(1);if(r.error)throw r.error;
  S.me=r.data[0];if(!S.me)throw new Error("No patient record found.");S.pts=[S.me];await loadRest([S.me.id])}
function reload(){return S.role==="staff"?loadStaff():loadPatient()}

/* ---------- actions ---------- */
function ack(id){run(async function(){var r=await sb.from("checkins").update({ack:true}).eq("id",id);if(r.error)throw r.error;await loadStaff()})}
function send(pid){var t=v("mt");if(!t)return;run(async function(){var r=await sb.from("messages").insert({patient_id:pid,body:t});if(r.error)throw r.error;await reload()})}
function setStatus(pid,s){run(async function(){var r=await sb.from("patients").update({status:s}).eq("id",pid);if(r.error)throw r.error;await loadStaff()})}
function resetPin(pid){if(!confirm("Make a new PIN? The old PIN stops working."))return;run(async function(){S.reg=await fn({action:"reset_pin",org_id:S.org,patient_id:pid})})}
function addp(){run(async function(){
  var b={action:"register",org_id:S.org,name:v("f_n"),age:v("f_a"),phone:v("f_p"),dx:v("f_dx"),dept:v("f_dept"),ward:v("f_w"),meds:v("f_m"),dd:v("f_d")||undefined};
  if(!b.name||!b.dx||!b.dept)throw new Error("Name, diagnosis and department are required.");
  S.reg=await fn(b);await loadStaff()})}
function yn(k,val){if($("cn"))S.note=$("cn").value;S.form=S.form||{};S.form[k]=val;draw()}
function submitCi(){var f=S.form||{};
  if(QS.some(function(q){return f[q[0]]===undefined})){S.flash="Please answer all four questions.";return draw()}
  var note=v("cn");
  run(async function(){var row={patient_id:S.me.id,meds:f.meds,sw:f.sw,br:f.br,fv:f.fv,note:note,urgent:!!S.urgent};
    var r=await sb.from("checkins").insert(row);
    if(r.error){
      if(!navigator.onLine||/fetch|network/i.test(r.error.message||"")){var q=qget();q.push({pid:S.me.id,t:Date.now(),row:row});qset(q);
        S.queued=true;S.form=null;S.urgent=false;S.redo=false;S.note="";
        throw new Error("No connection. Your check-in is saved on this phone and will send by itself when you are online. If you feel very unwell, go to the nearest clinic.")}
      throw r.error}
    S.form=null;S.urgent=false;S.redo=false;S.note="";await loadPatient()})}

/* ---------- views ---------- */
function loginV(){var st=S.mode==="staff";
  return'<div class="card"><h1>CareBridge</h1>'+fl()+'<div class="tabs"><button class="'+(st?"on":"")+'" onclick="S.mode=\'staff\';S.flash=\'\';draw()">Staff</button><button class="'+(st?"":"on")+'" onclick="S.mode=\'patient\';S.flash=\'\';draw()">Patient</button></div>'
  +(st?'<label for="lo">Organization ID</label><input id="lo" value="'+esc(S.org||localStorage.getItem("cb_org")||"")+'" autocomplete="off"><label for="le">Email</label><input id="le" type="email" autocomplete="username">'
      :'<label for="lc">Patient code</label><input id="lc" placeholder="CB-1001" autocomplete="username">')
  +'<label for="lp">'+(st?"Password":"PIN")+'</label><input id="lp" type="password" autocomplete="current-password"'+(st?"":' inputmode="numeric"')+'><button class="btn full" onclick="login()">Sign in</button></div>'}
function enrolV(){return'<div class="card"><h2>Set up your authenticator</h2>'+fl()+'<p>Scan this code with an authenticator app (Google Authenticator, Microsoft Authenticator, Authy), then type the 6-digit code it shows.</p><p><img src="'+esc(S.qr)+'" alt="QR code" width="180" height="180"></p><p class="mute">Cannot scan? Enter this key by hand: <b>'+esc(S.secret)+'</b></p><label for="mc">6-digit code</label><input id="mc" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button class="btn full" onclick="verifyMfa()">Verify and continue</button></div>'}
function challV(){return'<div class="card"><h2>Enter your authenticator code</h2>'+fl()+'<label for="mc">6-digit code</label><input id="mc" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button class="btn full" onclick="verifyMfa()">Verify</button><p><button class="btn alt sm" onclick="out()">Cancel</button></p></div>'}
function head(){return'<div class="top"><b>CareBridge</b><span><small>'+esc(S.name)+'</small> <button class="btn alt sm" onclick="out()">Sign out</button></span></div>'}
function alerts(){return S.pts.filter(function(p){var c=last(p.id);return p.status==="monitoring"&&c&&c.risk!=="green"&&!c.ack})}
function missed(){if(new Date().getHours()<12)return[];var t=new Date().toISOString().slice(0,10);
  return S.pts.filter(function(p){var c=last(p.id);return p.status==="monitoring"&&p.dd<=t&&!(c&&isToday(c.created_at))})}
function nav(){var n=alerts().length+missed().length;
  return'<div class="tabs">'+[["patients","Patients"],["alerts","Alerts"+(n?" ("+n+")":"")],["register","Register"],["account","Account"]].map(function(t){
    return'<button class="'+(S.tab===t[0]&&!S.sel?"on":"")+'" onclick="'+(t[0]==="account"?"openAccount()":"S.tab=\'"+t[0]+"\';S.sel=null;S.reg=null;S.flash=\'\';draw()")+'">'+t[1]+"</button>"}).join("")+"</div>"}
function rowV(p,extra){var r=lv(p.id);
  return'<button class="row" onclick="S.sel='+p.id+';S.reg=null;draw()"><span class="dot '+r+'"></span><span class="grow"><b>'+esc(p.name)+'</b><small>'+esc(p.dx)+" · "+esc(p.dept)+(extra?" · "+esc(extra):"")+'</small></span><span class="pill '+r+'">'+LB[r]+"</span></button>"}
function listV(){var q=S.q.toLowerCase(),ord={red:0,amber:1,none:2,green:3};
  var L=S.pts.filter(function(p){return p.status===S.flt&&(!S.dept||p.dept===S.dept)&&(!q||(p.name+p.code+p.dx+p.dept).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return ord[lv(a.id)]-ord[lv(b.id)]});
  return'<div class="tabs"><button class="'+(S.flt==="monitoring"?"on":"")+'" onclick="S.flt=\'monitoring\';draw()">Monitoring</button><button class="'+(S.flt==="closed"?"on":"")+'" onclick="S.flt=\'closed\';draw()">Closed</button></div>'
  +'<select aria-label="Department" onchange="S.dept=this.value;draw()"><option value="">All departments</option>'+DEPTS.map(function(d){return"<option"+(S.dept===d?" selected":"")+">"+d+"</option>"}).join("")+'</select>'
  +'<input type="search" value="'+esc(S.q)+'" placeholder="Search name, code, diagnosis or department" onchange="S.q=this.value;draw()">'
  +(L.map(function(p){return rowV(p)}).join("")||'<p class="mute">No patients here.</p>')}
function alertsV(){var a=alerts(),m=missed();
  return'<h2>Alerts</h2>'+(a.map(function(p){return rowV(p,"Not acknowledged")}).join("")+m.map(function(p){return rowV(p,"No check-in today")}).join("")||'<p class="mute">No open alerts.</p>')}
function regCard(){return S.reg?'<div class="banner"><b>Code '+esc(S.reg.code)+" · PIN "+esc(S.reg.pin)+'</b><div class="mute">Give these to the patient now. The PIN is not shown again.</div></div>':""}
function regV(){return'<h2>Register a patient</h2>'+regCard()+'<div class="card"><label for="f_n">Full name</label><input id="f_n"><div class="q"><div style="flex:1"><label for="f_a">Age</label><input id="f_a" inputmode="numeric"></div><div style="flex:2"><label for="f_p">Phone</label><input id="f_p" inputmode="tel"></div></div><label for="f_dx">Diagnosis</label><input id="f_dx"><label for="f_dept">Department</label><select id="f_dept"><option value="">Choose department…</option>'+DEPTS.map(function(d){return"<option>"+d+"</option>"}).join("")+'</select><label for="f_w">Ward</label><input id="f_w"><label for="f_m">Medicines</label><textarea id="f_m" rows="2"></textarea><label for="f_d">Discharge date</label><input id="f_d" type="date"><button class="btn full" onclick="addp()">Register patient</button></div>'}
function ciV(c,staff){var a=(c.meds?"Took medicines":"Missed medicines")+(c.sw?" · Swelling":"")+(c.br?" · Breathless":"")+(c.fv?" · Fever":"")+(c.em?" · Emergency flag":"");
  return'<div class="card"><span class="pill '+c.risk+'">'+LB[c.risk]+'</span> <small>'+esc(when(c.created_at))+'</small><br>'+esc(a)+(c.note?'<br>“'+esc(c.note)+'”':"")
  +(staff&&c.risk!=="green"&&!c.ack?'<br><button class="btn sm" onclick="ack('+c.id+')">Acknowledge</button>':"")+"</div>"}
function msgsV(pid){return(S.ms[pid]||[]).map(function(m){return'<div class="msg'+(m.sender_role==="patient"?"":" me")+'"><small>'+esc(m.sender_name)+" · "+esc(when(m.created_at))+'</small><br>'+esc(m.body)+"</div>"}).join("")
  +'<textarea id="mt" rows="2" placeholder="Write a message"></textarea><button class="btn sm" onclick="send('+pid+')">Send</button>'}
function detailV(p){var cs=S.ci[p.id]||[];
  return'<button class="btn alt sm" onclick="S.sel=null;S.reg=null;draw()">‹ Back</button><h2>'+esc(p.name)+'</h2><p class="mute">'+esc(p.code)+" · "+esc(p.dx)+" · "+esc(p.dept)+(p.ward?" · "+esc(p.ward):"")+(p.age?" · "+esc(p.age)+" yrs":"")+(p.phone?" · "+esc(p.phone):"")+"</p>"
  +(p.meds?"<p><b>Medicines:</b> "+esc(p.meds)+"</p>":"")
  +"<p>"+(cs.slice(-7).map(function(c){return'<span class="dot '+c.risk+'" title="'+esc(when(c.created_at))+'"></span> '}).join("")||'<span class="mute">No check-ins yet</span>')+"</p>"+regCard()
  +"<h3>Recent check-ins</h3>"+(cs.slice(-8).reverse().map(function(c){return ciV(c,true)}).join("")||'<p class="mute">None yet.</p>')
  +"<h3>Messages</h3>"+msgsV(p.id)
  +'<p><button class="btn alt sm" onclick="setStatus('+p.id+",'"+(p.status==="monitoring"?"closed":"monitoring")+"')\">"+(p.status==="monitoring"?"Close monitoring":"Reopen monitoring")+'</button> <button class="btn alt sm" onclick="resetPin('+p.id+')">New PIN</button></p>'}
function teamRow(m){return'<div class="row" style="cursor:default"><span class="grow"><b>'+esc(m.name)+'</b><small>'+esc(m.email)+" · "+esc(m.role)+(m.active?"":" · access removed")+"</small></span>"
  +(m.user_id===S.uid?"":'<button class="btn alt sm" onclick="setActive(\''+m.user_id+"',"+(!m.active)+')">'+(m.active?"Remove access":"Restore")+"</button>")+"</div>"}
function orgsV(){var o=S.orgs||[],n=S.newOrg;
  return"<h3>Organizations</h3>"+(n?'<div class="banner"><b>'+esc(n.name)+' created.</b><br>Staff sign in with this Organization ID: <b>'+esc(n.id)+'</b><div class="mute">Use Switch below to open it, then add its staff under Team.</div></div>':"")
  +o.map(function(x){return'<div class="row" style="cursor:default"><span class="grow"><b>'+esc(x.name)+"</b><small>"+esc(x.role)+" · ID "+esc(x.id)+(x.id===S.org?" · current":"")+"</small></span>"+(x.id===S.org?"":'<button class="btn alt sm" onclick="switchOrg(\''+x.id+'\')">Switch</button>')+"</div>"}).join("")
  +(S.orgRole==="owner"?'<div class="card"><h3>Create a new organization</h3><label for="on_n">Name of the hospital or clinic</label><input id="on_n"><button class="btn full" onclick="addOrg()">Create organization</button></div>':"")}
function accountV(){var n=S.newStaff,own=S.orgRole==="owner";
  return'<h2>Account</h2><div class="card"><h3>Change my password</h3><label for="pw1">New password (10 or more characters)</label><input id="pw1" type="password" autocomplete="new-password"><label for="pw2">Repeat it</label><input id="pw2" type="password" autocomplete="new-password"><button class="btn" onclick="changePw()">Change password</button></div>'
  +orgsV()+(own?"<h3>Team</h3>"+(n?'<div class="banner"><b>'+esc(n.name)+" ("+esc(n.role)+')</b><br>Email: <b>'+esc(n.email)+'</b><br>Temporary password: <b>'+esc(n.password)+'</b><div class="mute">Shown once. Give it to them privately and ask them to change it here. They set up their own authenticator at first sign-in.</div></div>':"")
    +(S.team||[]).map(teamRow).join("")+'<div class="card"><h3>Add a staff member</h3><label for="st_n">Full name</label><input id="st_n"><label for="st_e">Email</label><input id="st_e" type="email"><label for="st_r">Role</label><select id="st_r"><option value="nurse">Nurse</option><option value="owner">Owner</option></select><button class="btn full" onclick="addStaff()">Add staff member</button></div>':"")}
function staffV(){var p=S.sel&&S.pts.find(function(x){return x.id===S.sel});
  return head()+nav()+fl()+(p?detailV(p):S.tab==="alerts"?alertsV():S.tab==="register"?regV():S.tab==="account"?accountV():listV())}
function patientV(){var p=S.me,c=last(p.id),done=c&&isToday(c.created_at)&&!S.redo,msg={green:"Thank you. You are on track. Keep taking your medicines.",amber:"Thank you. A nurse will look at your answers and may call you.",red:"Please contact your nurse or go to the nearest clinic now if you feel very unwell."};
  var body;
  if(p.status!=="monitoring")body='<div class="banner">Your monitoring has ended. Thank you.</div>';
  else if(done)body='<div class="card"><span class="pill '+c.risk+'">'+LB[c.risk]+"</span><p>"+msg[c.risk]+'</p></div><button class="btn alt full" onclick="S.redo=true;draw()">Answered by mistake? Send a new check-in</button>';
  else{var f=S.form||{};
    body='<div class="card"><h3>Today’s check-in</h3>'+QS.map(function(q){return'<div class="q"><span>'+q[1]+'</span><span><button class="btn sm'+(f[q[0]]===true?"":" alt")+'" onclick="yn(\''+q[0]+'\',true)">Yes</button> <button class="btn sm'+(f[q[0]]===false?"":" alt")+'" onclick="yn(\''+q[0]+'\',false)">No</button></span></div>'}).join("")
      +'<label><input type="checkbox" '+(S.urgent?"checked":"")+' onchange="S.urgent=this.checked"> I have chest pain, or I feel faint</label><label for="cn" style="display:block;margin-top:10px">Anything else to tell the nurse? (optional)</label><textarea id="cn" rows="2">'+esc(S.note)+'</textarea><button class="btn full" onclick="submitCi()">Send check-in</button></div>'}
  return head()+fl()+(S.queued?'<div class="banner">A check-in is saved on this phone and will send when you are online.</div>':"")+"<h2>Hello, "+esc(p.name)+"</h2>"+body+(p.status==="monitoring"?"":"")+"<h3>Messages</h3>"+msgsV(p.id)}
function draw(){var h=S.stage==="login"?loginV():S.stage==="enrol"?enrolV():S.stage==="challenge"?challV():S.role==="patient"?patientV():staffV();A.innerHTML='<div class="wrap">'+h+'<p class="mute" style="text-align:center"><small>build 6</small></p></div>'}
boot();
</script></body></html>
